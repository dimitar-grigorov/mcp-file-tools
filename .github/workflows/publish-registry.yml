name: Publish to MCP Registry

# No `release: published` trigger: GoReleaser creates the release with the
# workflow's GITHUB_TOKEN, and GitHub suppresses workflow triggers from
# GITHUB_TOKEN events - so that trigger never fired (v2.0.1 and v3.0.0 were
# silently never published). Release.yml calls this workflow directly instead.
on:
  workflow_call:         # chained from release.yml after GoReleaser
    inputs:
      version:
        description: 'Version tag to publish (e.g., v3.0.0)'
        required: true
        type: string
  workflow_dispatch:     # manual re-publish of a specific tag
    inputs:
      version:
        description: 'Version tag to publish (e.g., v3.0.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # Required for MCP Registry OIDC auth

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION_TAG: ${{ inputs.version }}
      MCP_PUBLISHER_VERSION: 1.8.0
      MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download checksums
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --retry-all-errors \
            "https://github.com/${{ github.repository }}/releases/download/${VERSION_TAG}/checksums.txt" \
            -o checksums.txt
          cat checksums.txt

      - name: Generate server.json
        run: |
          set -euo pipefail
          node scripts/generate-server-json.js "${VERSION_TAG}" checksums.txt server.json
          cat server.json

      - name: Download mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fSL --retry 3 --retry-all-errors \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}" \
            -o "${archive}"
          printf '%s  %s\n' "${MCP_PUBLISHER_SHA256}" "${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          chmod +x mcp-publisher

      - name: Publish to MCP Registry
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
