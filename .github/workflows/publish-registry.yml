name: Publish to MCP Registry

# Called from release.yml: GITHUB_TOKEN events never fire a `release: published` trigger.
on:
  workflow_call:         # chained from release.yml after GoReleaser
    inputs:
      version:
        description: 'Version tag to publish (e.g., v3.0.0)'
        required: true
        type: string
  workflow_dispatch:     # manual re-publish of a specific tag
    inputs:
      version:
        description: 'Version tag to publish (e.g., v3.0.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # Required for MCP Registry OIDC auth

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION_TAG: ${{ inputs.version }}
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A manual dispatch can start before GoReleaser has uploaded the assets.
      - name: Download checksums
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/releases/download/${VERSION_TAG}/checksums.txt"
          for attempt in $(seq 1 30); do
            if curl -fsSL "$url" -o checksums.txt; then
              cat checksums.txt
              exit 0
            fi
            echo "no checksums.txt on ${VERSION_TAG} yet (${attempt}/30) — is the Release workflow still running?"
            sleep 10
          done
          echo "::error::${VERSION_TAG} still has no checksums.txt after 5 minutes. Check that the release exists and GoReleaser finished."
          exit 1

      - name: Generate server.json
        run: |
          set -euo pipefail
          node scripts/generate-server-json.js "${VERSION_TAG}" checksums.txt server.json
          cat server.json

      - name: Download mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fSL --retry 3 --retry-all-errors \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}" \
            -o "${archive}"
          printf '%s  %s\n' "${MCP_PUBLISHER_SHA256}" "${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          chmod +x mcp-publisher

      - name: Publish to MCP Registry
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
