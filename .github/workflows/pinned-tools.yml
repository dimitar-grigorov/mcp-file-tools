name: Pinned tools

# GoReleaser and mcp-publisher are version strings, not actions or modules, so Dependabot never bumps them.
on:
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare with the latest releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pinned-tools.js
