name: Test

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

      - name: Verify go.mod and go.sum are tidy
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        if: matrix.os == 'ubuntu-latest'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Run govulncheck
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Lint GitHub Actions workflows
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/validate-workflows.sh

      - name: Test release scripts
        run: node --test scripts/generate-server-json.test.js scripts/verify-release-version.test.js

      - name: Test all server operations
        run: go run test_server.go
