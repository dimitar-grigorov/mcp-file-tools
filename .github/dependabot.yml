version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-dependencies:
        update-types:
          - "minor"
          - "patch"

  # Lint tools as `tool` directives, so the pins get PRs instead of rotting in a `go run` line.
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    groups:
      lint-tools:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Both are pinned by digest, so nothing updates them without this.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
