version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-dependencies:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Both are pinned by digest, so nothing updates them without this.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
